<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flygg的小站 - 银河渡舟</title>
    <meta
      name="description"
      content="flygg的小站：专注前端开发与技术分享"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Background Stars -->
      <div class="stars-container">
         <div class="stars"></div>
         <div class="stars2"></div>
         <div class="stars3"></div>
      </div>

      <header class="site-header">
        <div class="site-header__content">
            <div class="logo-area">
                <span class="logo-text">flygg的小站</span>
            </div>
            <nav class="site-nav">
                <a
                v-for="link in navLinks"
                :key="link.href"
                class="site-nav__item"
                :href="link.href"
                >
                {{ link.label }}
                </a>
          </nav>
          <!-- Optional Right Actions -->
          <div class="header-actions">
             <i class="fas fa-search"></i>
          </div>
        </div>
      </header>

      <main class="main-layout" id="top">
         <aside class="sidebar-left">
            <div class="profile-card">
                <div class="profile-cover"></div>
                <div class="profile-info">
                    <img src="" class="avatar" alt="flygg">
                    <h2 class="name">flygg</h2>
                    <p class="bio"></p>
                    <div class="social-icons">
                        <i class="fab fa-github"></i>
                        <i class="fab fa-weixin"></i>
                        <i class="fab fa-twitter"></i>
                    </div>
                    <div class="stats-row">
                        <div class="stat"><span class="num">12</span><span class="txt">文章</span></div>
                        <div class="stat"><span class="num">34</span><span class="txt">标签</span></div>
                    </div>
                </div>
            </div>
            
            <div class="widget tags-widget">
                 <h3><i class="fas fa-tags"></i> 标签云</h3>
                 <div class="tags-cloud">
                    <span v-for="tag in topTags" class="tag-item">#{{tag}}</span>
                 </div>
            </div>
         </aside>

         <div class="content-right">
             <!-- Featured or Hero style card for the first post if needed, or just list style as cards -->
             <div class="posts-list">
                 <post-card v-for="post in posts" :key="post.slug" :post="post"></post-card>
             </div>
         </div>
      </main>

      <footer class="site-footer">
        <p>© 2026 flygg的小站. All rights reserved.</p>
      </footer>
    </div>

    <template id="post-card-template">
      <article class="post-card slide-up">
        <div class="post-cover" :style="{ background: post.cover || 'var(--accent)' }">
             <!-- If real image, use img tag, but using div bg for now based on app.js data -->
        </div>
        <div class="post-info">
            <div class="post-meta-line">
                <span class="date"><i class="far fa-calendar"></i> {{ formattedDate }}</span>
                <span class="read-time"><i class="far fa-clock"></i> {{ post.readTime }} min</span>
            </div>
            <h3 class="post-title">{{ post.title }}</h3>
            <div class="post-tags-line">
                <span v-for="tag in post.tags" class="post-tag">#{{ tag }}</span>
            </div>
            <p class="post-excerpt">{{ post.excerpt }}</p>
        </div>
      </article>
    </template>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
